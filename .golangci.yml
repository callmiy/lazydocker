version: "2"

linters:
  enable:
    - thelper
    - tparallel
    - wastedassign
    - unparam
    - prealloc
    - unconvert
    - exhaustive
    - makezero
    - nakedret
    # - goconst # TODO: enable and fix issues
  settings:
    exhaustive:
      default-signifies-exhaustive: true

    nakedret:
      # the gods will judge me but I just don't like naked returns at all
      max-func-lines: 0
    staticcheck:
      # Preserve bug-focused checks; leave stylistic and quick-fix debt for separate cleanup.
      checks:
        - all
        - "-QF*"
        - "-ST*"
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

run:
  go: '1.21'
